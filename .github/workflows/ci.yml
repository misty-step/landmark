name: Quality Checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  local-gate:
    if: false
    runs-on: ubuntu-latest
    steps:
      - name: Controlled failure, never run the product gate in this proof
        run: exit 1

  merge-gate:
    runs-on: ubuntu-latest
    needs: [local-gate]
    if: always()
    steps:
      - name: All checks passed
        env:
          LOCAL_GATE_RESULT: ${{ needs.local-gate.result }}
        run: test "${LOCAL_GATE_RESULT}" = success
