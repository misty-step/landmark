name: pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      artifact_run:
        description: 'Preview a retained github-pages artifact from this repository (blank builds this ref)'
        type: string
        default: ''
      rollback_version:
        description: 'Roll back only the Cloudflare preview to this native Worker version'
        type: string
        default: ''

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'push' && 'github-pages' || 'cloudflare-preview' }}
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        if: inputs.artifact_run == '' && inputs.rollback_version == ''
        with:
          toolchain: 1.96.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Build the marketing site from canonical notes
        if: inputs.artifact_run == '' && inputs.rollback_version == ''
        run: node bin/build-site.mjs
      - name: Reuse the exact retained site artifact
        if: inputs.artifact_run != '' && inputs.rollback_version == ''
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_RUN: ${{ inputs.artifact_run }}
        run: |
          gh run download "$ARTIFACT_RUN" -R "$GITHUB_REPOSITORY" -n github-pages -D .landmark/previous
          mkdir -p .landmark/site
          tar -xf .landmark/previous/artifact.tar -C .landmark/site
      - uses: actions/configure-pages@v5
        if: github.event_name == 'push'
      - uses: actions/upload-pages-artifact@v3
        if: inputs.rollback_version == ''
        with:
          path: .landmark/site
      - id: deployment
        if: github.event_name == 'push'
        uses: actions/deploy-pages@v4
      - name: Deploy or roll back the isolated Cloudflare preview
        if: github.event_name == 'workflow_dispatch'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ROLLBACK_VERSION: ${{ inputs.rollback_version }}
        run: |
          if [ -n "$ROLLBACK_VERSION" ]; then
            npx --yes wrangler@4.128.0 rollback "$ROLLBACK_VERSION" --message 'CI preview rollback'
          else
            npx --yes wrangler@4.128.0 deploy
          fi
