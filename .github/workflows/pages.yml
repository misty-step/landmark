name: pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      artifact_run:
        description: 'Promote a retained github-pages artifact from this repository (blank builds the default branch)'
        type: string
        default: ''
      rollback_version:
        description: 'Roll back Cloudflare to this native Worker version without rebuilding'
        type: string
        default: ''

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: [self-hosted, hetzner-ci, landmark-ci]
    environment:
      name: ${{ github.event_name == 'push' && 'github-pages' || 'cloudflare-production' }}
      url: https://landmark.mistystep.io
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        if: inputs.artifact_run == '' && inputs.rollback_version == ''
        with:
          toolchain: 1.96.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install GitHub CLI
        run: sudo apt-get update && sudo apt-get install -y gh
      - name: Build the marketing site from canonical notes
        if: inputs.artifact_run == '' && inputs.rollback_version == ''
        run: node bin/build-site.mjs
      - name: Reuse the exact retained site artifact
        if: inputs.artifact_run != '' && inputs.rollback_version == ''
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_RUN: ${{ inputs.artifact_run }}
        run: |
          gh run download "$ARTIFACT_RUN" -R "$GITHUB_REPOSITORY" -n github-pages -D .landmark/previous
          mkdir -p .landmark/site
          tar -xf .landmark/previous/artifact.tar -C .landmark/site
      - name: Validate the Cloudflare configuration without deploying
        if: inputs.rollback_version == ''
        run: npx --yes wrangler@4.128.0 deploy --dry-run
      - name: Refuse backward source promotion
        env:
          SITE_URL: https://landmark-site-preview.misty-step.workers.dev
          ARTIFACT_RUN: ${{ inputs.artifact_run }}
          ROLLBACK_VERSION: ${{ inputs.rollback_version }}
        run: |
          if [ -z "$ARTIFACT_RUN$ROLLBACK_VERSION" ]; then
            curl --fail --silent --show-error "$SITE_URL/release.json" -o .landmark/deployed-release.json
            deployed="$(node -p 'require("./.landmark/deployed-release.json").revision')"
            git merge-base --is-ancestor "$deployed" "$GITHUB_SHA"
          fi
      - uses: actions/configure-pages@v5
        if: github.event_name == 'push'
      - uses: actions/upload-pages-artifact@v3
        if: inputs.rollback_version == ''
        with:
          path: .landmark/site
      - name: Deploy or roll back Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ROLLBACK_VERSION: ${{ inputs.rollback_version }}
        run: |
          if [ -n "$ROLLBACK_VERSION" ]; then
            npx --yes wrangler@4.128.0 rollback "$ROLLBACK_VERSION" --message 'CI production rollback'
          else
            npx --yes wrangler@4.128.0 deploy
          fi
      - name: Verify the promoted identity and canonical notes
        if: inputs.rollback_version == ''
        run: |
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 https://landmark.mistystep.io/release.json -o .landmark/live-release.json
          cmp .landmark/site/release.json .landmark/live-release.json
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 https://landmark.mistystep.io/changelog -o .landmark/live-changelog.html
          cmp .landmark/site/changelog.html .landmark/live-changelog.html
      - id: deployment
        if: github.event_name == 'push'
        uses: actions/deploy-pages@v4
