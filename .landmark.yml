product:
  name: Landmark
  description: Focused release pipeline action powered by semantic-release.
audience: developer
voice: clear, specific, user-facing
changelog:
  source: auto
artifacts:
  markdown: docs/releases/{version}.md
  json: docs/releases/releases.json
release:
  profile: full
model:
  policy: balanced
budget:
  max_input_tokens: 12000
  max_output_tokens: 1200
