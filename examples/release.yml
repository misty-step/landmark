name: Release

on:
  workflow_run:
    # Replace "CI" if your primary pipeline uses a different workflow name.
    workflows:
      - CI
    # Trigger only after the upstream CI workflow completes.
    types:
      - completed
    # Keep both names for repositories that still use master.
    branches:
      - main
      - master
  # Optional manual trigger for one-off release runs.
  workflow_dispatch:

concurrency:
  group: release-${{ github.repository }}-${{ github.event.repository.default_branch }}
  cancel-in-progress: false

jobs:
  release:
    if: |
      (github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')) ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       (github.event.workflow_run.head_branch == 'master' || github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # semantic-release and release body updates need write permissions.
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          # semantic-release inspects full git history and tags.
          fetch-depth: 0
          # Landmark sets an authenticated remote URL during release.
          persist-credentials: false
      - name: Skip if default branch has advanced
        id: bound
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          head="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${DEFAULT_BRANCH}" --jq .sha)"
          if [ "${head}" != "${TESTED_SHA}" ]; then
            echo "stale=true" >> "${GITHUB_OUTPUT}"
            echo "::notice::Skipping stale Landmark run tested=${TESTED_SHA} origin/${DEFAULT_BRANCH}=${head}"
          else
            echo "stale=false" >> "${GITHUB_OUTPUT}"
          fi

      # Short-lived installation token from a GitHub App installed on this
      # repo, instead of a personal access token. See README's "Why a
      # GitHub App, not a PAT".
      - name: Mint release token
        if: steps.bound.outputs.stale != 'true'
        id: release-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.LANDMARK_RELEASER_APP_ID }}
          private-key: ${{ secrets.LANDMARK_RELEASER_PRIVATE_KEY }}

      # Landmark: Automated semantic-release pipeline
      # https://github.com/misty-step/landmark
      - name: Run Landmark
        if: steps.bound.outputs.stale != 'true'
        uses: misty-step/landmark@v0
        with:
          github-token: ${{ steps.release-token.outputs.token }}
          # OpenRouter API key for synthesized "What's New" notes.
          llm-api-key: ${{ secrets.OPENROUTER_API_KEY }}
          # Optional: customize model and fallbacks.
          # llm-model: deepseek/deepseek-v4-flash-0731
          # llm-fallback-models: "google/gemini-3.7-flash,deepseek/deepseek-v4-pro-0813"
          # Optional: custom chat-completions endpoint (OpenAI-compatible).
          # llm-api-url: https://api.openai.com/v1/chat/completions
          # Optional Node.js version for semantic-release.
          node-version: "24"
          # Set to "false" to skip synthesis and only publish technical notes.
          synthesis: "true"
